<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تحسين السيرة الذاتية (ATS)</title>
    
    <!-- كود إثبات ملكية Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7946557086083356"
         crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        
        /* خلفية فخمة تدمج الأزرق الغامق والبنفسجي بتدرج فضائي ساحر */
        body { 
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 50%, #060913 100%);
            color: #f8fafc;
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }
        
        /* حاوية بتصميم زجاجي فاخر (Glassmorphism) مع حدود بنفسجية متوهجة خفيفاً */
        .container { 
            max-width: 700px; 
            width: 100%; 
            background: rgba(30, 41, 59, 0.75); 
            backdrop-filter: blur(16px);
            color: #f8fafc;
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid rgba(139, 92, 246, 0.35); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(59, 130, 246, 0.15); 
            height: fit-content;
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .btn:hover { background: #2563eb; box-shadow: 0 0 12px rgba(59, 130, 246, 0.5); }
        
        .btn-green { background: #8b5cf6; } /* تحويل زر إنشاء الحساب للبنفسجي الملكي الفخم */
        .btn-green:hover { background: #7c3aed; box-shadow: 0 0 12px rgba(139, 92, 246, 0.5); }
        
        .btn-red { background: #ef4444; } /* زر الخروج والإغلاق باللون الأحمر الجريء */
        .btn-red:hover { background: #dc2626; box-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }
        
        /* زر التحسين الرئيسي بتدرج فخم يجمع الأزرق والبنفسجي والأحمر بانسجام */
        .btn-main { 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            margin-top: 15px; 
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ef4444 100%);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }
        .btn-main:hover {
            opacity: 0.95;
            box-shadow: 0 6px 25px rgba(239, 68, 68, 0.5);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #c4b5fd; } /* لون بنفسجي فاتح وراقي للعناوين */
        
        /* حقول الإدخال ذات الطابع السيبراني الداكن */
        input[type="text"], input[type="email"], input[type="password"], textarea, select { 
            width: 100%; 
            padding: 11px; 
            background: #090d16;
            color: #fff;
            border: 1px solid #475569; 
            border-radius: 8px; 
            outline: none; 
            transition: all 0.3s; 
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, textarea:focus, selectfocu, select:focus { 
            border-color: #8b5cf6; 
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
        }
        textarea { height: 120px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(5px); }
        .modal-box { background: #1e293b; color: #f8fafc; padding: 25px; border-radius: 12px; width: 340px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(139, 92, 246, 0.4); }
        
        /* صندوق النتائج بتصميم متوهج ذكي */
        .result-box { 
            display: none; 
            margin-top: 20px; 
            padding: 15px; 
            background: rgba(9, 13, 22, 0.9) !important; 
            border: 1px solid #8b5cf6 !important; 
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
            color: #f8fafc; 
            border-radius: 10px; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div id="unauthSec">
            <button class="btn" id="openLoginBtn">تسجيل الدخول</button>
            <button class="btn btn-green" id="openSignUpBtn">إنشاء حساب</button>
        </div>
        <div id="authSec" style="display: none;">
            <span id="userEmail" style="margin-left: 10px; font-weight: bold; color: #93c5fd;"></span>
            <button class="btn btn-red" id="logoutBtn">خروج</button>
        </div>
    </div>

    <h2 style="color: #f1f5f9; text-align: center; margin-bottom: 25px; letter-spacing: 0.5px;">✨ منصة ذكاء سيرة الذاتية (AI-ATS)</h2>

    <form id="cvForm" onsubmit="return false;">
        <div class="form-group">
            <label>المسمى الوظيفي:</label>
            <input type="text" id="jobTitle" name="job_title" required placeholder="مثال: AI Engineer / Software Developer">
        </div>

        <div class="form-group">
            <label>اللغة المطلوبة:</label>
            <select name="language" id="outLang">
                <option value="English">الإنجليزية (English)</option>
                <option value="Arabic">العربية (Arabic)</option>
            </select>
        </div>

        <div class="form-group">
            <label>رفع ملف CV (PDF/DOCX):</label>
            <input type="file" id="cvFile" name="cv_file" accept=".pdf,.docx">
        </div>

        <div class="form-group">
            <label>أو الصق النص هنا:</label>
            <textarea id="cvText" name="cv_text"></textarea>
        </div>

        <button type="button" class="btn btn-main" id="submitBtn">تحسين السيرة الذاتية بالذكاء الاصطناعي 🚀</button>
    </form>

    <div id="resultBox" class="result-box">
        <h3 style="color: #a78bfa;">النتيجة الذكية:</h3>
        <div id="resultContent"></div>
    </div>
</div>

<div id="loginModal" class="modal">
    <div class="modal-box">
        <h3 style="color: #a78bfa; margin-top: 0;">تسجيل الدخول</h3>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني"><br><br>
        <input type="password" id="loginPassword" placeholder="كلمة المرور"><br><br>
        <button class="btn" style="width: 100%;" id="loginSubmitBtn">دخول</button><br><br>
        <button class="btn btn-red" style="width: 100%;" id="closeLoginBtn">إغلاق</button>
    </div>
</div>

<div id="signUpModal" class="modal">
    <div class="modal-box">
        <h3 style="color: #a78bfa; margin-top: 0;">إنشاء حساب جديد</h3>
        <input type="email" id="signUpEmail" placeholder="البريد الإلكتروني"><br><br>
        <input type="password" id="signUpPassword" placeholder="كلمة المرور"><br><br>
        <button class="btn btn-green" style="width: 100%;" id="signUpSubmitBtn">إنشاء حساب</button><br><br>
        <button class="btn btn-red" style="width: 100%;" id="closeSignUpBtn">إغلاق</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const loginModal = document.getElementById('loginModal');
        const signUpModal = document.getElementById('signUpModal');

        document.getElementById('openLoginBtn').onclick = () => loginModal.style.display = 'flex';
        document.getElementById('closeLoginBtn').onclick = () => loginModal.style.display = 'none';
        
        document.getElementById('openSignUpBtn').onclick = () => signUpModal.style.display = 'flex';
        document.getElementById('closeSignUpBtn').onclick = () => signUpModal.style.display = 'none';

        const SUPABASE_URL = "{{ supabase_url|default('') }}";
        const SUPABASE_ANON_KEY = "{{ supabase_key|default('') }}";
        let supabase = null;
        let currentUser = null;

        if (window.supabase && SUPABASE_URL.trim() !== "" && SUPABASE_URL.startsWith('http')) {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                supabase.auth.getSession().then(({ data }) => {
                    if (data && data.session) {
                        currentUser = data.session.user;
                        updateUI();
                    }
                }).catch(err => console.log("Supabase error:", err));
            } catch (e) { console.log("Supabase init failed:", e); }
        }

        function updateUI() {
            if (currentUser) {
                document.getElementById('unauthSec').style.display = 'none';
                document.getElementById('authSec').style.display = 'block';
                document.getElementById('userEmail').innerText = currentUser.email;
            } else {
                document.getElementById('unauthSec').style.display = 'block';
                document.getElementById('authSec').style.display = 'none';
            }
        }

        document.getElementById('loginSubmitBtn').onclick = () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!supabase) return alert("إعدادات Supabase غير مفعلة على السيرفر حالياً.");
            supabase.auth.signInWithPassword({ email, password }).then(({ data, error }) => {
                if (error) alert(error.message);
                else {
                    currentUser = data.user;
                    updateUI();
                    loginModal.style.display = 'none';
                }
            });
        };

        document.getElementById('signUpSubmitBtn').onclick = () => {
            const email = document.getElementById('signUpEmail').value;
            const password = document.getElementById('signUpPassword').value;
            if (!supabase) return alert("إعدادات Supabase غير مفعلة على السيرفر حالياً.");
            supabase.auth.signUp({ email, password }).then(({ data, error }) => {
                if (error) alert(error.message);
                else {
                    alert("تم إنشاء الحساب بنجاح! يرجى التحقق من بريدك الإلكتروني.");
                    signUpModal.style.display = 'none';
                }
            });
        };

        document.getElementById('logoutBtn').onclick = () => {
            if (supabase) supabase.auth.signOut();
            currentUser = null;
            updateUI();
        };

        document.getElementById('submitBtn').onclick = function() {
            const jobTitle = document.getElementById('jobTitle').value.trim();
            const cvText = document.getElementById('cvText').value.trim();
            const cvFile = document.getElementById('cvFile').files.length;

            if (!jobTitle) return alert("يرجى إدخال المسمى الوظيفي");
            if (!cvText && cvFile === 0) return alert("يرجى وضع النص أو رفع ملف");

            const btn = this;
            btn.disabled = true;
            btn.innerText = "جاري التحليل والتحسين بالذكاء الاصطناعي... ⏳";

            const formData = new FormData(document.getElementById('cvForm'));

            fetch('/optimize', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.formatted_html || data.result) {
                    document.getElementById('resultContent').innerHTML = data.formatted_html || data.result;
                    document.getElementById('resultBox').style.display = 'block';
                    
                    if (supabase && (data.formatted_html || data.raw_text)) {
                        const payload = { job_title: jobTitle, cv_content: data.raw_text || data.result };
                        if (currentUser) payload.user_id = currentUser.id;
                        supabase.from('cvs').insert([payload]).then(({error}) => { if(error) console.log(error); });
                    }
                } else {
                    alert("حدثت مشكلة أثناء المعالجة.");
                }
            })
            .catch(err => alert("حدث خطأ بالاتصال مع السيرفر."))
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "تحسين السيرة الذاتية بالذكاء الاصطناعي 🚀";
            });
        };
    });
</script>
