<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">أداة تحسين السيرة الذاتية (ATS)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .top-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .top-btn:hover { background-color: #1d4ed8; }
        .title-sec { text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #334155; }
        
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            letter-spacing: normal !important;
            direction: inherit;
        }
        textarea { resize: vertical; min-height: 140px; }
        .divider { text-align: center; color: #94a3b8; margin: 15px 0; font-weight: bold; }
        
        .submit-btn {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .submit-btn:hover { background-color: #1d4ed8; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
        }
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button type="button" class="top-btn" onclick="openAuthModal()">تسجيل الدخول / حساب جديد</button>
        <select id="siteLang" style="width: auto; padding: 6px 10px;">
            <option value="ar">العربية SA</option>
            <option value="en">English US</option>
        </select>
    </div>

    <div class="title-sec">
        <h1>أداة تحسين السيرة الذاتية الشاملة (ATS)</h1>
        <p>تحسين السيرة الذاتية، دعم الـ PDF، التصدير، وتوافق الفرز الآلي</p>
    </div>

    <form id="optimizeForm">
        <div class="form-group">
            <label>المسمى الوظيفي المستهدف:</label>
            <input type="text" id="jobTitle" name="job_title" placeholder="مثال: AI & Robotics Engineer" required>
        </div>

        <div class="form-group">
            <label>لغة النتيجة المطلوبة:</label>
            <select name="language" id="outLang">
                <option value="English">الإنجليزية (English)</option>
                <option value="Arabic">العربية (Arabic)</option>
            </select>
        </div>

        <div class="form-group">
            <label>رفع ملف السيرة الذاتية (PDF أو DOCX):</label>
            <input type="file" id="cvFile" name="cv_file" accept=".pdf,.docx">
        </div>

        <div class="divider">— أو —</div>

        <div class="form-group">
            <label>الصق نص السيرة الذاتية هنا:</label>
            <textarea id="cvText" name="cv_text" placeholder="ضع نص السيرة الذاتية هنا..."></textarea>
        </div>

        <button type="button" id="submitBtn" class="submit-btn" onclick="processCV()">تحسين السيرة الذاتية الآن 🚀</button>
    </form>

    <div id="resultBox" class="result-box">
        <h3>النتيجة المحسّنة:</h3>
        <div id="resultText"></div>
    </div>
</div>

<!-- Modal -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <h3>تسجيل الدخول / إنشاء حساب</h3>
        <input type="email" id="authEmail" placeholder="البريد الإلكتروني" style="margin-bottom: 10px;">
        <input type="password" id="authPassword" placeholder="كلمة المرور" style="margin-bottom: 15px;">
        <div style="display: flex; gap: 10px;">
            <button type="button" onclick="alert('تم تسجيل الدخول بنجاح')" class="top-btn" style="flex:1;">دخول</button>
            <button type="button" onclick="closeModal('authModal')" class="top-btn" style="flex:1; background-color:#64748b;">إلغاء</button>
        </div>
    </div>
</div>

<script>
  function openAuthModal() {
      document.getElementById('authModal').style.display = 'flex';
  }

  function closeModal(id) {
      document.getElementById(id).style.display = 'none';
  }

  function processCV() {
      const jobTitle = document.getElementById('jobTitle').value.trim();
      const cvText = document.getElementById('cvText').value.trim();
      const cvFile = document.getElementById('cvFile').files.length;

      if (!jobTitle) {
          alert("يرجى كتابة المسمى الوظيفي المستهدف.");
          return;
      }

      if (!cvText && cvFile === 0) {
          alert("يرجى رفع ملف سيرة ذاتية أو لصق النص.");
          return;
      }

      const btn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('resultBox');
      const resultText = document.getElementById('resultText');

      btn.innerText = "جاري المعالجة بواسطة الذكاء الاصطناعي... ⏳";
      btn.disabled = true;

      const formData = new FormData(document.getElementById('optimizeForm'));

      fetch('/optimize', {
          method: 'POST',
          body: formData
      })
      .then(res => res.json())
      .then(data => {
          if (data.formatted_html) {
              resultText.innerHTML = data.formatted_html;
              resultBox.style.display = 'block';
          } else if (data.result) {
              alert(data.result);
          }
      })
      .catch(err => {
          alert("حدث خطأ أثناء الاتصال بالسيرفر.");
      })
      .finally(() => {
          btn.innerText = "تحسين السيرة الذاتية الآن 🚀";
          btn.disabled = false;
      });
  }
</script>
</body>
</html>
