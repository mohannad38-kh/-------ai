<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">أداة تحسين السيرة الذاتية الذكية (ATS Optimizer)</title>
    
    <!-- مكتبة Supabase الضروية لعامل التسجيل -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .top-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .top-btn:hover { background-color: #1d4ed8; }
        .title-sec { text-align: center; margin-bottom: 25px; }
        .title-sec h1 { margin: 0 0 8px 0; color: #1e293b; }
        .title-sec p { color: #64748b; margin: 0; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #334155; }
        
        /* حل مشكلة النص المتفكك وتحسين المظهر */
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            letter-spacing: normal !important; /* يمنع تفكك الأحرف العربية */
            direction: inherit;
        }
        
        textarea { resize: vertical; min-height: 140px; }
        
        .divider { text-align: center; color: #94a3b8; margin: 15px 0; font-weight: bold; }
        
        .submit-btn {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover { background-color: #1d4ed8; }
        .submit-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
        }
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <button id="authBtn" class="top-btn" onclick="openAuthModal()">تسجيل الدخول / حساب جديد</button>
            <button id="logoutBtn" class="top-btn" onclick="logout()" style="display:none; background-color:#ef4444;">تسجيل الخروج</button>
            <span id="userEmail" style="margin-right:10px; font-weight:bold; color:#475569;"></span>
        </div>
        <select id="siteLang" onchange="changeWebsiteLanguage()" style="width: auto; padding: 6px 10px;">
            <option value="ar">العربية SA</option>
            <option value="en">English US</option>
        </select>
    </div>

    <div class="title-sec">
        <h1 id="mainTitle">أداة تحسين السيرة الذاتية الشاملة (ATS)</h1>
        <p id="mainSubtitle">تحسين السيرة الذاتية، دعم الـ PDF، التصدير، وتوافق الفرز الآلي</p>
    </div>

    <form id="optimizeForm" onsubmit="event.preventDefault(); optimizeCV();">
        <div class="form-group">
            <label id="lblJobTitle">المسمى الوظيفي المستهدف:</label>
            <input type="text" id="jobTitle" name="job_title" placeholder="مثال: AI & Robotics Engineer" required>
        </div>

        <div class="form-group">
            <label id="lblLang">لغة النتيجة المطلوبة:</label>
            <select name="language" id="outLang">
                <option value="English">الإنجليزية (English)</option>
                <option value="Arabic">العربية (Arabic)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="lblFile">رفع ملف السيرة الذاتية (PDF أو DOCX):</label>
            <input type="file" id="cvFile" name="cv_file" accept=".pdf,.docx">
        </div>

        <div class="divider" id="dividerText">— أو —</div>

        <div class="form-group">
            <label id="lblText">الصق نص السيرة الذاتية هنا:</label>
            <textarea id="cvText" name="cv_text" placeholder="ضع نص السيرة الذاتية هنا..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">تحسين السيرة الذاتية الآن 🚀</button>
    </form>

    <div id="resultBox" class="result-box">
        <h3 id="resultTitle">النتيجة المحسّنة:</h3>
        <div id="resultText"></div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <form action="/download/word" method="POST" target="_blank" style="margin:0;">
                <input type="hidden" name="content" id="wordContentInput">
                <button type="submit" id="wordBtnText" class="top-btn" style="background-color: #16a34a;">تحميل كملف Word 📄</button>
            </form>
            <button onclick="printPDF()" id="pdfBtnText" class="top-btn" style="background-color: #0284c7;">تحميل كملف PDF 📑</button>
        </div>
    </div>
</div>

<!-- Auth Modal -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <h3>تسجيل الدخول / إنشاء حساب</h3>
        <input type="email" id="authEmail" placeholder="البريد الإلكتروني" style="margin-bottom: 10px;">
        <input type="password" id="authPassword" placeholder="كلمة المرور" style="margin-bottom: 15px;">
        <div style="display: flex; gap: 10px;">
            <button onclick="login()" class="top-btn" style="flex:1;">دخول</button>
            <button onclick="signUp()" class="top-btn" style="flex:1; background-color:#16a34a;">حساب جديد</button>
        </div>
        <button onclick="closeModal('authModal')" style="width:100%; margin-top:10px; background:none; border:none; color:#64748b; cursor:pointer;">إلغاء</button>
    </div>
</div>

<!-- Paywall Modal -->
<div id="payModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">🔒 وصلت للحد المجاني</h3>
        <p id="modalDesc">لقد استخدمت محاولاتك الـ 3 المجانية لهذا اليوم.</p>
        <button onclick="closeModal('payModal')" class="top-btn" style="width:100%;" id="closeBtnText">إغلاق</button>
    </div>
</div>

<script>
  const SUPABASE_URL = "{{ supabase_url }}";
  const SUPABASE_ANON_KEY = "{{ supabase_key }}";
  
  let supabase = null;
  let currentUser = null;
  let latestRawText = "";

  window.onload = function() {
      if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
          try {
              supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
              supabase.auth.getSession().then(({ data }) => {
                  if (data && data.session) {
                      currentUser = data.session.user;
                      updateAuthUI();
                  }
              });
          } catch(e) { console.log("Supabase initialization bypassed/failed."); }
      }
  };

  function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function updateAuthUI() {
      if (currentUser) {
          document.getElementById('userEmail').innerText = currentUser.email;
          document.getElementById('authBtn').style.display = 'none';
          document.getElementById('logoutBtn').style.display = 'inline-block';
      } else {
          document.getElementById('userEmail').innerText = '';
          document.getElementById('authBtn').style.display = 'inline-block';
          document.getElementById('logoutBtn').style.display = 'none';
      }
  }

  function signUp() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      if (!email || !password) return alert("يرجى إدخال البريد الإلكتروني وكلمة المرور.");
      if(!supabase) return alert("مكتبة Supabase غير متصلة بشكل صحيح.");

      supabase.auth.signUp({ email, password }).then(({ data, error }) => {
          if (error) alert("خطأ: " + error.message);
          else {
              alert("تم إنشاء الحساب بنجاح!");
              closeModal('authModal');
          }
      });
  }

  function login() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      if(!supabase) return alert("مكتبة Supabase غير متصلة بشكل صحيح.");

      supabase.auth.signInWithPassword({ email, password }).then(({ data, error }) => {
          if (error) alert("خطأ: " + error.message);
          else {
              currentUser = data.user;
              updateAuthUI();
              closeModal('authModal');
          }
      });
  }

  function logout() {
      if(supabase) supabase.auth.signOut();
      currentUser = null;
      updateAuthUI();
  }

  function optimizeCV() {
      const jobTitle = document.getElementById('jobTitle').value.trim();
      const cvText = document.getElementById('cvText').value.trim();
      const cvFile = document.getElementById('cvFile').files.length;

      if (!jobTitle) {
          alert("يرجى كتابة المسمى الوظيفي المستهدف.");
          return;
      }

      if (!cvText && cvFile === 0) {
          alert("يرجى رفع ملف سيرة ذاتية أو لصق النص في المربع.");
          return;
      }

      const btn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('resultBox');
      const resultText = document.getElementById('resultText');

      btn.innerText = "جاري المعالجة بواسطة الذكاء الاصطناعي... ⏳";
      btn.disabled = true;

      const form = document.getElementById('optimizeForm');
      const formData = new FormData(form);

      fetch('/optimize', {
          method: 'POST',
          body: formData
      })
      .then(res => res.json().then(data => ({ status: res.status, body: data })))
      .then(res => {
          if (res.status === 403) {
              document.getElementById('payModal').style.display = 'flex';
          } else if (res.status === 200) {
              latestRawText = res.body.raw_text;
              resultText.innerHTML = res.body.formatted_html;
              document.getElementById('wordContentInput').value = latestRawText;
              resultBox.style.display = 'block';
          } else {
              alert(res.body.result || 'حدث خطأ غير متوقع.');
          }
      })
      .catch(error => alert("حدث خطأ أثناء الاتصال بالخادم."))
      .finally(() => {
          btn.innerText = "تحسين السيرة الذاتية الآن 🚀";
          btn.disabled = false;
      });
  }

  function printPDF() { window.print(); }
</script>
</body>
</html>
