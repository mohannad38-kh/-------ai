<!DOCTYPE html>
<html id="htmlRoot" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تحسين السيرة الذاتية (ATS)</title>
    
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 750px; width: 100%; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .auth-buttons { display: flex; gap: 10px; align-items: center; }
        .top-btn { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .top-btn:hover { background-color: #1d4ed8; }
        .top-btn.secondary { background-color: #10b981; }
        .top-btn.secondary:hover { background-color: #059669; }
        .google-btn { width: 100%; background-color: #ffffff; color: #333; border: 1px solid #cbd5e1; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .google-btn:hover { background-color: #f8fafc; }
        .title-sec { text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #334155; }
        
        input[type="text"], input[type="email"], input[type="password"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;
            letter-spacing: normal !important; direction: inherit;
        }
        textarea { resize: vertical; min-height: 140px; }
        .divider { text-align: center; color: #94a3b8; margin: 15px 0; font-weight: bold; }
        
        .submit-btn { width: 100%; background-color: #2563eb; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .submit-btn:hover { background-color: #1d4ed8; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; max-width: 400px; width: 90%; }
        .result-box { display: none; margin-top: 25px; padding: 20px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="auth-buttons">
            <div id="unauthSec" style="display: flex; gap: 8px;">
                <button type="button" class="top-btn" onclick="openModal('loginModal')">تسجيل الدخول</button>
                <button type="button" class="top-btn secondary" onclick="openModal('signUpModal')">إنشاء حساب جديد</button>
            </div>
            <div id="authSec" style="display: none; align-items: center; gap: 10px;">
                <span id="userEmail" style="font-weight: bold; color: #334155;"></span>
                <button type="button" class="top-btn" onclick="logout()" style="background-color: #ef4444;">تسجيل الخروج</button>
            </div>
        </div>
        <select id="siteLang" style="width: auto; padding: 6px 10px;">
            <option value="ar">العربية SA</option>
            <option value="en">English US</option>
        </select>
    </div>

    <div class="title-sec">
        <h1>أداة تحسين السيرة الذاتية الشاملة (ATS)</h1>
        <p>تحسين السيرة الذاتية، دعم الـ PDF، التصدير، وتوافق الفرز الآلي</p>
    </div>

    <form id="optimizeForm" onsubmit="return false;">
        <div class="form-group">
            <label>المسمى الوظيفي المستهدف:</label>
            <input type="text" id="jobTitle" name="job_title" placeholder="مثال: AI & Robotics Engineer" required>
        </div>

        <div class="form-group">
            <label>لغة النتيجة المطلوبة:</label>
            <select name="language" id="outLang">
                <option value="English">الإنجليزية (English)</option>
                <option value="Arabic">العربية (Arabic)</option>
            </select>
        </div>

        <div class="form-group">
            <label>رفع ملف السيرة الذاتية (PDF أو DOCX):</label>
            <input type="file" id="cvFile" name="cv_file" accept=".pdf,.docx">
        </div>

        <div class="divider">— أو —</div>

        <div class="form-group">
            <label>الصق نص السيرة الذاتية هنا:</label>
            <textarea id="cvText" name="cv_text" placeholder="ضع نص السيرة الذاتية هنا..."></textarea>
        </div>

        <button type="button" id="submitBtn" class="submit-btn" onclick="processCV()">تحسين السيرة الذاتية الآن 🚀</button>
    </form>

    <div id="resultBox" class="result-box">
        <h3>النتيجة المحسّنة:</h3>
        <div id="resultText"></div>
    </div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>تسجيل الدخول</h3>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" style="margin-bottom: 10px;">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" style="margin-bottom: 15px;">
        <button type="button" onclick="loginWithEmail()" class="top-btn" style="width: 100%;">دخول</button>
        
        <div class="divider">— أو —</div>
        
        <button type="button" onclick="loginWithGoogle()" class="google-btn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.01C2.45 15.96 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.87 10.8c-.18-.53-.28-1.1-.28-1.8s.1-1.27.28-1.8L.97 4.99C.35 6.22 0 7.57 0 9s.35 2.78.97 4.01l2.9-2.21z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.04.97 4.99l2.9 2.21C4.59 5.05 6.62 3.58 9 3.58z"/></svg>
            متابعة باستخدام Google
        </button>

        <button type="button" onclick="closeModal('loginModal')" style="width:100%; margin-top:15px; background:none; border:none; color:#64748b; cursor:pointer;">إلغاء</button>
    </div>
</div>

<!-- Sign Up Modal -->
<div id="signUpModal" class="modal">
    <div class="modal-content">
        <h3>إنشاء حساب جديد</h3>
        <input type="email" id="signUpEmail" placeholder="البريد الإلكتروني" style="margin-bottom: 10px;">
        <input type="password" id="signUpPassword" placeholder="كلمة المرور" style="margin-bottom: 15px;">
        <button type="button" onclick="signUpWithEmail()" class="top-btn secondary" style="width: 100%;">إنشاء الحساب</button>
        
        <div class="divider">— أو —</div>
        
        <button type="button" onclick="loginWithGoogle()" class="google-btn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.01C2.45 15.96 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.87 10.8c-.18-.53-.28-1.1-.28-1.8s.1-1.27.28-1.8L.97 4.99C.35 6.22 0 7.57 0 9s.35 2.78.97 4.01l2.9-2.21z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.04.97 4.99l2.9 2.21C4.59 5.05 6.62 3.58 9 3.58z"/></svg>
            التسجيل باستخدام Google
        </button>

        <button type="button" onclick="closeModal('signUpModal')" style="width:100%; margin-top:15px; background:none; border:none; color:#64748b; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script>
  // حماية إعدادات Supabase من التسبب في إيقاف السكربت
  const SUPABASE_URL = "{{ supabase_url|default('') }}";
  const SUPABASE_ANON_KEY = "{{ supabase_key|default('') }}";
  
  let supabase = null;
  let currentUser = null;

  window.addEventListener('DOMContentLoaded', function() {
      if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_URL.startsWith('http')) {
          try {
              supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
              supabase.auth.getSession().then(({ data }) => {
                  if (data && data.session) {
                      currentUser = data.session.user;
                      updateAuthUI();
                  }
              });

              supabase.auth.onAuthStateChange((event, session) => {
                  if (session) {
                      currentUser = session.user;
                  } else {
                      currentUser = null;
                  }
                  updateAuthUI();
              });
          } catch(e) { console.log("Supabase initialization bypassed:", e); }
      }
  });

  function openModal(id) { 
      const modal = document.getElementById(id);
      if(modal) modal.style.display = 'flex'; 
  }
  
  function closeModal(id) { 
      const modal = document.getElementById(id);
      if(modal) modal.style.display = 'none'; 
  }

  function updateAuthUI() {
      const unauthSec = document.getElementById('unauthSec');
      const authSec = document.getElementById('authSec');
      const userEmail = document.getElementById('userEmail');

      if (currentUser) {
          if(userEmail) userEmail.innerText = currentUser.email;
          if(unauthSec) unauthSec.style.display = 'none';
          if(authSec) authSec.style.display = 'flex';
      } else {
          if(userEmail) userEmail.innerText = '';
          if(unauthSec) unauthSec.style.display = 'flex';
          if(authSec) authSec.style.display = 'none';
      }
  }

  function loginWithEmail() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) return alert("يرجى إدخال البريد الإلكتروني وكلمة المرور.");
      if (!supabase) return alert("مكتبة Supabase غير محددة المفاتيح في app.py.");

      supabase.auth.signInWithPassword({ email, password }).then(({ data, error }) => {
          if (error) alert("خطأ في تسجيل الدخول: " + error.message);
          else {
              currentUser = data.user;
              updateAuthUI();
              closeModal('loginModal');
          }
      });
  }

  function signUpWithEmail() {
      const email = document.getElementById('signUpEmail').value;
      const password = document.getElementById('signUpPassword').value;
      if (!email || !password) return alert("يرجى إدخال البريد الإلكتروني وكلمة المرور.");
      if (!supabase) return alert("مكتبة Supabase غير محددة المفاتيح في app.py.");

      supabase.auth.signUp({ email, password }).then(({ data, error }) => {
          if (error) alert("خطأ في إنشاء الحساب: " + error.message);
          else {
              alert("تم إنشاء الحساب بنجاح!");
              closeModal('signUpModal');
          }
      });
  }

  function loginWithGoogle() {
      if (!supabase) return alert("مكتبة Supabase غير محددة المفاتيح في app.py.");
      supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin }
      }).catch(err => alert("خطأ في تسجيل قوقل: " + err.message));
  }

  function logout() {
      if (supabase) supabase.auth.signOut();
      currentUser = null;
      updateAuthUI();
  }

  function saveCVToSupabase(jobTitle, content) {
      if (!supabase) return;

      const payload = {
          job_title: jobTitle,
          cv_content: content
      };

      if (currentUser && currentUser.id) {
          payload.user_id = currentUser.id;
      }

      supabase.from('cvs').insert([payload]).then(({ error }) => {
          if (error) console.error("Supabase Save Error:", error.message);
          else console.log("تم حفظ السيرة الذاتية بنجاح!");
      });
  }

  function processCV() {
      const jobTitle = document.getElementById('jobTitle').value.trim();
      const cvText = document.getElementById('cvText').value.trim();
      const cvFile = document.getElementById('cvFile').files.length;

      if (!jobTitle) {
          alert("يرجى كتابة المسمى الوظيفي المستهدف.");
          return;
      }

      if (!cvText && cvFile === 0) {
          alert("يرجى رفع ملف سيرة ذاتية أو لصق النص.");
          return;
      }

      const btn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('resultBox');
      const resultText = document.getElementById('resultText');

      btn.innerText = "جاري المعالجة بواسطة الذكاء الاصطناعي... ⏳";
      btn.disabled = true;

      const formData = new FormData(document.getElementById('optimizeForm'));

      fetch('/optimize', {
          method: 'POST',
          body: formData
      })
      .then(res => res.json())
      .then(data => {
          if (data.formatted_html) {
              resultText.innerHTML = data.formatted_html;
              resultBox.style.display = 'block';
              saveCVToSupabase(jobTitle, data.raw_text);
          } else if (data.result) {
              alert(data.result);
          }
      })
      .catch(err => {
          alert("حدث خطأ أثناء الاتصال بالسيرفر.");
      })
      .finally(() => {
          btn.innerText = "تحسين السيرة الذاتية الآن 🚀";
          btn.disabled = false;
      });
  }
</script>
</body>
</html>
